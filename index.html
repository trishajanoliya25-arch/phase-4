<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Content Generator</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1> AI Content Generator</h1>

    <textarea
      id="inputText"
      placeholder="Enter your question or text here..."
    ></textarea>


    <div class="buttons">

      <button onclick="generateContent('answer')">
        Ask AI
      </button>

      <button onclick="generateContent('summary')">
        Summarize
      </button>

      <button onclick="generateContent('ideas')">
        Get Ideas
      </button>

    </div>


    <div id="result">
      Your result will appear here...
    </div>

  </div>


  <script src="script.js"></script>

</body>

</html>
